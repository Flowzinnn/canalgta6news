<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links GTA 6</title>
<meta name="description" content="Contagem regressiva para o GTA 6 e os melhores links para garantir o seu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   NÃO PRECISA MEXER AQUI. Edite só o bloco "CONFIG" lá embaixo.
   ===================================================================== */
:root{
  --bg:#0b0614; --card:#160d26; --card2:#1d1131; --line:#2e1d4a;
  --text:#f6efff; --muted:#a998c4;
  --pink:#ff2e88; --orange:#ff8a3d; --cyan:#21e6ff; --purple:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255,46,136,.35), transparent 60%),
    radial-gradient(80% 40% at 50% 0%, rgba(255,138,61,.25), transparent 60%),
    var(--bg);
}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px 40px}

/* sol + palmeiras (desenho próprio, sem marca registrada) */
.sun{width:120px;height:120px;margin:0 auto -48px;border-radius:50%;
  background:linear-gradient(180deg,#ffd166 0%,var(--orange) 45%,var(--pink) 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 13px);
          mask:repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 13px);
  filter:drop-shadow(0 0 30px rgba(255,46,136,.6));opacity:.9}

.avatar{position:relative;width:96px;height:96px;margin:0 auto;border-radius:50%;
  display:grid;place-items:center;font-family:Anton,sans-serif;font-size:38px;letter-spacing:1px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:3px solid var(--bg);box-shadow:0 0 0 2px var(--pink),0 0 28px rgba(255,46,136,.55);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-family:Anton,sans-serif;font-weight:400;text-align:center;font-size:30px;letter-spacing:1.5px;
  margin-top:14px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--orange),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.handle{text-align:center;color:var(--muted);font-size:14px;margin-top:2px}
.tagline{text-align:center;font-size:15px;margin:10px auto 0;max-width:340px;line-height:1.45}

/* contagem regressiva */
.count{margin-top:22px;padding:16px;border-radius:18px;background:var(--card);
  border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.count::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(33,230,255,.08),transparent);
  animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.count small{display:block;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.timer{display:flex;justify-content:center;gap:8px;margin-top:10px}
.timer div{min-width:64px;padding:8px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.timer b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:30px;color:var(--cyan);
  text-shadow:0 0 14px rgba(33,230,255,.6);font-variant-numeric:tabular-nums}
.timer span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.launched{font-family:Anton,sans-serif;font-size:28px;color:var(--cyan);margin-top:8px;letter-spacing:1px}

/* links */
h2{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.links{display:flex;flex-direction:column;gap:10px}
a.btn,.btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;text-decoration:none;
  color:var(--text);background:var(--card);border:1px solid var(--line);
  transition:transform .12s,border-color .12s,box-shadow .12s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 6px 24px rgba(255,46,136,.25);outline:none}
a.btn:active{transform:scale(.98)}
.btn .ico{font-size:24px;width:32px;text-align:center;flex:none}
.btn .txt{flex:1;min-width:0}
.btn .t{font-weight:800;font-size:15px;line-height:1.25}
.btn .d{font-size:13px;color:var(--muted);margin-top:2px}
.btn .arrow{color:var(--pink);font-weight:800;font-size:18px}
.btn.destaque{background:linear-gradient(135deg,var(--pink),var(--orange));border:0;
  box-shadow:0 8px 30px rgba(255,46,136,.45);animation:pulse 2.4s ease-in-out infinite}
.btn.destaque .d{color:rgba(255,255,255,.88)}
.btn.destaque .arrow{color:#fff}
@keyframes pulse{50%{box-shadow:0 8px 38px rgba(255,138,61,.65)}}
.btn.off{opacity:.45;cursor:default;animation:none}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.18);margin-left:6px;vertical-align:2px}

/* redes */
.social{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.social a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text);
  text-decoration:none;font-size:13px;font-weight:600;background:var(--card)}
.social a:hover{border-color:var(--cyan)}

footer{margin-top:30px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.55}
footer p+p{margin-top:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sun" aria-hidden="true"></div>
  <div class="avatar" id="avatar"></div>
  <h1 id="nome"></h1>
  <div class="handle" id="handle"></div>
  <p class="tagline" id="frase"></p>

  <section class="count" aria-live="polite">
    <small id="countLabel"></small>
    <div class="timer" id="timer">
      <div><b id="dd">--</b><span>dias</span></div>
      <div><b id="hh">--</b><span>horas</span></div>
      <div><b id="mm">--</b><span>min</span></div>
      <div><b id="ss">--</b><span>seg</span></div>
    </div>
  </section>

  <div id="secoes"></div>
  <div class="social" id="redes"></div>

  <footer>

  </footer>

  handle: "@canalgta6news",       // seu @ do TikTok
  sigla:  "GN",                   // texto no círculo (se não tiver foto)
  foto:   "",                     // vazio = usa a foto do GTA NEWS que já está embutida
  frase:  "Notícias e memes do GTA 6 mais atualizados do Brasil 🌴🔥",

  // Lançamento (PS5 e Xbox Series). Horário aproximado (meia-noite de Brasília).
  lancamento: "2026-11-19T00:00:00-03:00",

  secoes: [
    {
      titulo: "Garanta o seu",
      links: [
        { icone:"🎮", titulo:"GTA 6 — PS5", desc:"Ver preço no Mercado Livre", link:"https://meli.la/2RgnQbj", destaque:true },
        { icone:"🟩", titulo:"GTA 6 — Xbox Series", desc:"Ver preço", link:"" },
      ]
    },
    {
      titulo: "Meu setup / pra jogar melhor",
      links: [
        { icone:"🕹️", titulo:"Console PS5", desc:"Ver preço no Mercado Livre", link:"https://meli.la/1h2r99o" },
        { icone:"🎯", titulo:"Controle PS5 extra", desc:"Pra jogar com a galera", link:"https://meli.la/11L7vvB" },
        { icone:"🔋", titulo:"Carregador duplo de controle", desc:"Nunca mais fique sem bateria", link:"https://meli.la/2KtRB9q" },
        { icone:"🎧", titulo:"Headset gamer", desc:"Custo-benefício", link:"" },
      ]
    }
  ],

  // Suas redes (deixe link "" para esconder)
  redes: [
    { nome:"TikTok",   link:"https://www.tiktok.com/@canalgta6news" },
    { nome:"YouTube",  link:"https://www.youtube.com/@Gta6news-s4i" },
    { nome:"Instagram",link:"" },
  ]
};
/* ===================== FIM DO CONFIG ===================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$("nome").textContent = CONFIG.nome;
$("handle").textContent = CONFIG.handle;
$("frase").textContent = CONFIG.frase;
document.title = CONFIG.nome + " • Links GTA 6";
const fotoFinal = CONFIG.foto || (typeof FOTO_PADRAO !== "undefined" ? FOTO_PADRAO : "");
if (fotoFinal) { $("avatar").innerHTML = '<img alt="" src="'+esc(fotoFinal)+'">'; }
else { $("avatar").textContent = CONFIG.sigla; }

let html = "";
for (const s of CONFIG.secoes) {
  html += '<h2>'+esc(s.titulo)+'</h2><div class="links">';
  for (const l of s.links) {
    const ativo = l.link && l.link.trim();
    const cls = "btn" + (l.destaque && ativo ? " destaque" : "") + (ativo ? "" : " off");
    const inner =
      '<span class="ico">'+esc(l.icone||"🔗")+'</span>' +
      '<span class="txt"><div class="t">'+esc(l.titulo)+(l.destaque && ativo ? '<span class="tag">🔥 top</span>':'')+'</div>' +
      '<div class="d">'+esc(ativo ? (l.desc||"") : "Link em breve")+'</div></span>' +
      '<span class="arrow">'+(ativo ? "→" : "")+'</span>';
    html += ativo
      ? '<a class="'+cls+'" href="'+esc(l.link.trim())+'" target="_blank" rel="sponsored noopener">'+inner+'</a>'
      : '<div class="'+cls+'" aria-disabled="true">'+inner+'</div>';
  }
  html += '</div>';
}
$("secoes").innerHTML = html;

$("redes").innerHTML = CONFIG.redes
  .filter(r => r.link && r.link.trim())
  .map(r => '<a href="'+esc(r.link.trim())+'" target="_blank" rel="noopener">'+esc(r.nome)+'</a>').join("");

const alvo = new Date(CONFIG.lancamento).getTime();
const pad = n => String(n).padStart(2,"0");
function tick(){
  const diff = alvo - Date.now();
  if (diff <= 0) {
    $("countLabel").textContent = "GTA 6";
    $("timer").outerHTML = '<div class="launched">JÁ ESTÁ DISPONÍVEL! 🔥</div>';
    clearInterval(t); return;
  }
  $("countLabel").textContent = "GTA 6 chega em";
  $("dd").textContent = Math.floor(diff/864e5);
  $("hh").textContent = pad(Math.floor(diff/36e5)%24);
  $("mm").textContent = pad(Math.floor(diff/6e4)%60);
  $("ss").textContent = pad(Math.floor(diff/1e3)%60);
}
const t = setInterval(tick, 1000); tick();
</script>
</body>
</html>
